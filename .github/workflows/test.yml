name: Test and publish

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Test with race detector
        run: go test -count=1 -race ./...
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal tests)"

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Build backup image
        run: docker build -t mongodb-backup-s3:integration .
      - name: MongoDB replica set and S3 round trips
        env:
          BACKUP_TEST_IMAGE: mongodb-backup-s3:integration
          MONGODB_TEST_IMAGE: mongo:8.0
        run: go test -count=1 -tags=integration -v -timeout=20m ./tests/integration

  build-and-push-image:
    needs: [unit, integration]
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Prepare image names
        id: images
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_ENABLED: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          {
            echo 'names<<EOF'
            printf 'ghcr.io/%s\n' "$repository"
            if [[ "$DOCKERHUB_ENABLED" == 'true' ]]; then
              printf 'docker.io/%s/%s\n' "${DOCKERHUB_USERNAME,,}" "${repository##*/}"
            fi
            echo 'EOF'
            printf 'dockerhub_enabled=%s\n' "$DOCKERHUB_ENABLED"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: steps.images.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.images.outputs.names }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
